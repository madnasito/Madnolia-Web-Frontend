<div class="container-fluid animate__animated animate__fadeIn animate__duration-1s p-0">

  <!-- Hero Section -->
  <app-organism-hero-section [title]="'LANDING.HERO.TITLE_1' | translate" [highlightedText]="'LANDING.HERO.HIGHLIGHT' | translate" [titleSuffix]="'LANDING.HERO.TITLE_2' | translate"
    [subtitle]="'LANDING.HERO.SUBTITLE' | translate">
    <a routerLink="/download" class="btn btn-premium btn-lg px-5 py-3 rounded-pill fw-bold shadow-lg">{{ 'LANDING.HERO.BTN' | translate }}</a>
  </app-organism-hero-section>

  <!-- El Problema (The Villain) -->
  <app-organism-feature-grid class="section-padding text-white d-block"
    [title]="'LANDING.VILLAIN.TITLE' | translate">
    <div class="col-md-4">
      <app-molecule-feature-card [icon]="faSearch" iconColorClass="text-danger" [title]="'LANDING.VILLAIN.CARD1.TITLE' | translate"
        [description]="'LANDING.VILLAIN.CARD1.DESC' | translate">
      </app-molecule-feature-card>
    </div>
    <div class="col-md-4">
      <app-molecule-feature-card [icon]="faTools" iconColorClass="text-warning"
        [title]="'LANDING.VILLAIN.CARD2.TITLE' | translate"
        [description]="'LANDING.VILLAIN.CARD2.DESC' | translate">
      </app-molecule-feature-card>
    </div>
    <div class="col-md-4">
      <app-molecule-feature-card [icon]="faMicrophoneSlash" iconColorClass="text-info"
        [title]="'LANDING.VILLAIN.CARD3.TITLE' | translate"
        [description]="'LANDING.VILLAIN.CARD3.DESC' | translate">
      </app-molecule-feature-card>
    </div>
  </app-organism-feature-grid>

  <!-- La Solución (The Guide) -->
  <div class="section-padding text-white">
    <div class="container-fluid px-4 px-xl-5">
      <app-organism-split-info [title]="'LANDING.SOLUTION.TITLE' | translate" [icon]="faGamepad"
        iconColorClass="text-primary" [reverseLayout]="false">
        <div left-content>
          <p class="fs-4 lh-base text-secondary">
            {{ 'LANDING.SOLUTION.DESC' | translate }}
          </p>
        </div>
        <div right-content>
          <!-- Graphic -->
          <div class="border border-secondary border-opacity-25 rounded-4 shadow-lg overflow-hidden">
            <img src="public/media/home_en.png" alt="Ecosistema Madnolia" class="w-100 h-auto d-block">
          </div>
        </div>
      </app-organism-split-info>
    </div>
  </div>

  <!-- Zonas Horarias (The Villain / Solution) -->
  <div class="section-padding text-white pt-0">
    <div class="container-fluid px-4 px-xl-5">
      <app-organism-split-info [title]="'LANDING.TIMEZONE.TITLE' | translate" [icon]="faClock"
        iconColorClass="text-info" [reverseLayout]="true">
        <div left-content>
          <p class="fs-4 lh-base text-secondary" [innerHTML]="'LANDING.TIMEZONE.DESC' | translate">
          </p>
        </div>
        <div right-content>
          <!-- Graphic -->
          <div class="border border-secondary border-opacity-25 rounded-4 shadow-lg overflow-hidden">
            <video #timezoneVideo src="public/media/timezone.mp4" class="w-100 h-auto d-block" muted [muted]="true" autoplay loop playsinline></video>
          </div>
        </div>
      </app-organism-split-info>
    </div>
  </div>

  <!-- VLAN (The Magic) -->
  <div class="section-padding text-white pt-0">
    <div class="container-fluid px-4 px-xl-5">
      <app-organism-split-info [title]="'LANDING.VLAN.TITLE' | translate" [icon]="faNetworkWired"
        iconColorClass="text-white opacity-75" [reverseLayout]="false">
        <div left-content>
          <p class="fs-4 lh-base text-secondary">
            {{ 'LANDING.VLAN.DESC' | translate }}
          </p>
          <div class="mt-4">
            <a routerLink="/lan-party" class="btn btn-outline-light rounded-pill px-5 py-2 fw-bold shadow-sm"
              style="letter-spacing: 0.5px;">
              {{ 'LANDING.VLAN.BTN' | translate }}
            </a>
          </div>
        </div>
        <div right-content>
          <!-- Graphic -->
          <div class="border border-secondary border-opacity-25 rounded-4 shadow-lg overflow-hidden">
            <video src="public/media/home_lan_switch_en.mp4" class="w-100 h-auto d-block" autoplay muted loop></video>
          </div>
        </div>
      </app-organism-split-info>
    </div>
  </div>

  <!-- El Plan -->
  <app-organism-feature-grid class="section-padding text-white d-block" [title]="'LANDING.PLAN.TITLE' | translate">
    <div class="col-md-4">
      <app-molecule-step-card stepNumber="1" stepColorClass="bg-primary" [icon]="faDownload"
        iconColorClass="text-primary" [title]="'LANDING.PLAN.CARD1.TITLE' | translate"
        [description]="'LANDING.PLAN.CARD1.DESC' | translate"></app-molecule-step-card>
    </div>
    <div class="col-md-4">
      <app-molecule-step-card stepNumber="2" stepColorClass="bg-primary" [icon]="faCalendarPlus"
        iconColorClass="text-primary" [title]="'LANDING.PLAN.CARD2.TITLE' | translate"
        [description]="'LANDING.PLAN.CARD2.DESC' | translate"></app-molecule-step-card>
    </div>
    <div class="col-md-4">
      <app-molecule-step-card stepNumber="3" stepColorClass="bg-primary" [icon]="faHeadset"
        iconColorClass="text-primary" [title]="'LANDING.PLAN.CARD3.TITLE' | translate"
        [description]="'LANDING.PLAN.CARD3.DESC' | translate"></app-molecule-step-card>
    </div>
  </app-organism-feature-grid>

  <!-- Call to Action -->
  <section class="section-padding text-center text-white">
    <div class="container-fluid px-4 px-xl-5">
      <h2 class="display-4 fw-bold mb-4">{{ 'LANDING.CTA.TITLE' | translate }}</h2>
      <a routerLink="/download" class="btn btn-premium btn-lg px-5 py-3 rounded-pill fw-bold shadow-lg">{{ 'LANDING.CTA.BTN' | translate }}</a>
    </div>
  </section>

</div>
